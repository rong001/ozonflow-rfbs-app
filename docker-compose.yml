services:
  ozonflow:
    build: .
    image: ozonflow-rfbs:latest
    container_name: ozonflow
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DOCKER: "1"
      PORT: "8787"
    restart: unless-stopped
